# Load balancer in front of the ordering-api replicas (docker compose --profile app).
worker_processes 2;

events {
    worker_connections 8192;
}

http {
    # One log line per request would cost more than the proxying itself at load-test rates.
    access_log off;

    # Docker's embedded DNS. Re-resolved every few seconds: replicas that are recreated or scaled get new addresses,
    # and a name resolved only at start-up would keep sending traffic to dead ones.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ordering_api {
        # Shared memory for the re-resolved server list (required by "resolve").
        zone ordering_api 64k;
        # The service name resolves to every replica; requests are balanced round-robin over all of them.
        server ordering-api:8080 resolve;
        # Reused upstream connections: no TCP handshake per request.
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ordering_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # A POST is never re-sent to another replica (nginx's default for non-idempotent requests):
            # the client retries with the same Idempotency-Key instead, which makes the retry safe.
        }
    }
}
