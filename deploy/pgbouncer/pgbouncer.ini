; Applications connect here (port 6432), never to PostgreSQL directly.
; Migrations are the exception: they connect to postgres:5432 because they may use
; session-level features that transaction pooling cannot provide.

[databases]
; One server-side pool per service database: a misbehaving service can exhaust only its own pool
; (DB-level bulkhead). Sizes follow Little's Law: ~8k tx/s x ~3 ms ≈ 24 busy connections for ordering.
ordering     = host=postgres port=5432 dbname=ordering     pool_size=40
invoicing    = host=postgres port=5432 dbname=invoicing    pool_size=15
notification = host=postgres port=5432 dbname=notification pool_size=15

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; A server connection is held only for the duration of a transaction.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2

; Fail fast instead of queueing a client for the 120 s default when the pool is exhausted.
query_wait_timeout = 5

; Protocol-level prepared statements work in transaction mode since PgBouncer 1.21.
max_prepared_statements = 200

server_lifetime = 3600
server_idle_timeout = 600
